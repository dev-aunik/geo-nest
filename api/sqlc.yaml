version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/geo.sql"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "internal/repository"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
